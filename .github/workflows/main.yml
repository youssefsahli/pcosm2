name: Build Typst document

on:
  push:
    # We'll trigger this workflow on every push to the 'main' branch.
    branches:
      - pass-2
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  # This permission is required to create and update a release
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Typst document
        uses: lvignoli/typst-action@main
        with:
          source_file: main.typ
          options: |
            --font-path
            fonts

      - name: Upload PDF as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: main.pdf

      - name: Update 'Latest' Release with new PDF
        uses: softprops/action-gh-release@v2
        with:
          # This tells the action to always use the release tied to the 'latest' tag.
          # The action will create this tag and the release for you on the first run.
          tag_name: latest
          name: "Latest Build"
          body: "📄 This is the latest PDF automatically generated from the `main` branch."
          files: main.pdf
          # By marking it as a prerelease, it's clear this isn't a formal, versioned release.
          prerelease: true
